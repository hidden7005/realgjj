<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>MYGJJ</title>
<style>
:root {
  --system-bg: #f2f2f7;
  --card-bg: #ffffff;
  --secondary-card-bg: #f8f8fa;
  --label-primary: #1d1d1f;
  --label-secondary: #86868b;
  --label-tertiary: #a1a1a6;
  --separator: rgba(60, 60, 67, 0.12);
  --apple-blue: #0071e3;
  --apple-blue-hover: #0077ed;
  --apple-gold: #ff9500;
  --apple-real-start: #ff9500;
  --apple-real-end: #ff3b30;
  --glass-bg: rgba(255, 255, 255, 0.82);
  --glass-border: rgba(255, 255, 255, 0.45);
  --sheet-shadow: 0 -8px 32px rgba(0, 0, 0, 0.08);
  --card-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
}

@media (prefers-color-scheme: dark) {
  :root {
    --system-bg: #000000;
    --card-bg: #1c1c1e;
    --secondary-card-bg: #2c2c2e;
    --label-primary: #f5f5f7;
    --label-secondary: #98989d;
    --label-tertiary: #636366;
    --separator: rgba(84, 84, 88, 0.36);
    --apple-blue: #0a84ff;
    --apple-blue-hover: #409cff;
    --apple-gold: #ff9f0a;
    --glass-bg: rgba(28, 28, 30, 0.82);
    --glass-border: rgba(255, 255, 255, 0.1);
    --sheet-shadow: 0 -8px 32px rgba(0, 0, 0, 0.4);
    --card-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
  }
}

* { box-sizing: border-box; margin: 0; -webkit-tap-highlight-color: transparent; }
html, body {
  height: 100%;
  width: 100%;
  touch-action: manipulation;
}
#map {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  background: #e5e5ea;
  z-index: 1;
  touch-action: none;
}
body {
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Apple SD Gothic Neo", sans-serif;
  background: var(--system-bg);
  color: var(--label-primary);
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
  letter-spacing: -0.015em;
}

button { font: inherit; color: inherit; cursor: pointer; border: none; background: none; }

.glass {
  background: var(--glass-bg);
  -webkit-backdrop-filter: saturate(190%) blur(24px);
  backdrop-filter: saturate(190%) blur(24px);
  border: 0.5px solid var(--glass-border);
  box-shadow: 0 6px 20px rgba(0, 0, 0, 0.08);
}

#top-container {
  position: absolute;
  z-index: 5;
  left: 16px; right: 16px;
  top: calc(env(safe-area-inset-top, 0px) + 12px);
  max-width: 560px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

#top { display: flex; align-items: center; gap: 6px; width: 100%; }

/* 브랜드 로고 버튼 (간짜장면) */
.brand-btn {
  height: 46px;
  padding: 0 10px;
  border-radius: 14px;
  font-size: 14px;
  font-weight: 800;
  letter-spacing: -0.03em;
  display: flex;
  align-items: center;
  gap: 4px;
  color: var(--label-primary);
  white-space: nowrap;
  flex-shrink: 0;
  transition: transform 0.15s ease, background 0.15s ease;
}
.brand-btn:active {
  transform: scale(0.95);
  background: rgba(0, 0, 0, 0.05);
}
.brand-btn .brand-point {
  color: #ff9500;
}

/* 외부 지도 바로가기 50:50 아이콘 바 */
.map-links-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin-top: 10px;
}
.map-icon-btn {
  height: 46px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 14px;
  background: var(--secondary-card-bg);
  border: 0.5px solid var(--separator);
  transition: transform 0.12s ease, background 0.12s ease;
}
.map-icon-btn:active {
  transform: scale(0.97);
  background: rgba(0, 0, 0, 0.06);
}

/* 가격 제보 및 검증 카드 스타일 */
.price-verify-box {
  background: rgba(255, 149, 0, 0.09);
  border: 1px solid rgba(255, 149, 0, 0.35);
  border-radius: 16px;
  padding: 13px 15px;
  margin: 12px 0;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.price-verify-title {
  font-size: 13px;
  font-weight: 700;
  color: #ff9500;
  display: flex;
  align-items: center;
  gap: 5px;
}
.price-compare-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 14px;
  font-weight: 600;
}
.price-old {
  color: var(--label-secondary);
  text-decoration: line-through;
}
.price-new {
  color: var(--label-primary);
  font-weight: 800;
  font-size: 16px;
}
.btn-verify-price {
  height: 38px;
  border-radius: 12px;
  background: var(--apple-blue);
  color: #fff;
  font-size: 13px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 4px;
  margin-top: 4px;
}
.price-empty-banner {
  background: rgba(0, 113, 227, 0.08);
  border: 1px dashed var(--apple-blue);
  border-radius: 16px;
  padding: 14px;
  margin: 12px 0;
  text-align: center;
  cursor: pointer;
}
.price-empty-banner b {
  display: block;
  font-size: 15px;
  color: var(--apple-blue);
  margin-bottom: 3px;
}
.price-empty-banner p {
  font-size: 12px;
  color: var(--label-secondary);
  margin: 0;
}

/* 오류 제보 라디오 옵션 */
.report-group {
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin: 16px 0;
  background: var(--secondary-card-bg);
  padding: 14px;
  border-radius: 16px;
  border: 0.5px solid var(--separator);
}
.report-opt {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 15px;
  font-weight: 500;
  color: var(--label-primary);
  cursor: pointer;
}
.report-opt input[type="radio"] {
  width: 20px;
  height: 20px;
  accent-color: var(--apple-blue);
  margin: 0;
}

#q {
  flex: 1; min-width: 0; height: 46px; line-height: 46px; border-radius: 14px;
  padding: 0 12px; font-size: 14px; font-weight: 400; color: var(--label-primary);
  border: 0.5px solid var(--glass-border); transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
}
#q:focus { outline: none; box-shadow: 0 0 0 3px rgba(0, 113, 227, 0.3); }

#me {
  height: 46px; line-height: 46px; padding: 0 12px; border-radius: 14px;
  font-size: 14px; font-weight: 600; color: var(--apple-blue); white-space: nowrap; flex-shrink: 0;
}
#me:active { transform: scale(0.97); }

#sort-bar {
  display: flex; gap: 6px; overflow-x: auto; padding: 4px 2px; scrollbar-width: none;
}
#sort-bar::-webkit-scrollbar { display: none; }

.sort-pill {
  flex-shrink: 0; height: 34px; padding: 0 13px; border-radius: 999px; font-size: 13px;
  font-weight: 600; color: var(--label-secondary); background: var(--glass-bg);
  border: 0.5px solid var(--glass-border); display: flex; align-items: center; gap: 4px;
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
}
.sort-pill.filtered {
  background: var(--apple-blue); color: #fff; border-color: var(--apple-blue);
  box-shadow: 0 3px 12px rgba(0, 113, 227, 0.3);
}

.filter-popover {
  position: absolute; z-index: 7; top: calc(env(safe-area-inset-top, 0px) + 104px);
  max-width: 290px; border-radius: 20px; padding: 6px; box-shadow: 0 12px 36px rgba(0,0,0,0.18);
  display: flex; flex-direction: column; gap: 2px; border: 0.5px solid var(--glass-border);
}
.filter-popover[hidden] { display: none; }
.sort-pill[hidden] { display: none !important; } /* v0.061: 숨긴 필터 버튼(🔥 진짜 간짜장)이 보이던 문제 */
.menu-item {
  display: flex; align-items: center; justify-content: space-between;
  padding: 11px 14px; border-radius: 14px; font-size: 14px; font-weight: 500; color: var(--label-primary);
}
.menu-item.selected { font-weight: 700; color: var(--apple-blue); background: rgba(0, 113, 227, 0.09); }
.menu-item .check { font-size: 15px; font-weight: 700; color: var(--apple-blue); }

#res {
  position: absolute; z-index: 6; left: 16px; right: 16px; top: calc(env(safe-area-inset-top, 0px) + 112px);
  max-width: 560px; margin: 0 auto; max-height: 52%; overflow-y: auto; border-radius: 18px;
}
#res[hidden] { display: none; }
.row {
  display: block; width: 100%; text-align: left; padding: 14px 18px; border-bottom: 0.5px solid var(--separator);
  position: relative;
}
.row b { display: block; font-size: 16px; font-weight: 600; color: var(--label-primary); }
.row small { display: block; color: var(--label-secondary); font-size: 13px; margin-top: 3px; }
.row i { position: absolute; right: 18px; top: 50%; transform: translateY(-50%); font-style: normal; font-weight: 600; color: var(--apple-blue); }
.empty { padding: 20px 18px; text-align: center; color: var(--label-secondary); font-size: 15px; }

/* 진짜 간짜장 애플 스타일 인증 뱃지 */
.real-badge {
  display: inline-flex; align-items: center; gap: 3px;
  background: linear-gradient(135deg, var(--apple-real-start), var(--apple-real-end));
  color: #fff; border-radius: 6px; padding: 1px 6px; font-size: 11px; font-weight: 800;
  box-shadow: 0 2px 6px rgba(255, 59, 48, 0.35); vertical-align: middle;
}
.real-badge-header {
  display: inline-flex; align-items: center; gap: 4px;
  background: linear-gradient(135deg, rgba(255, 149, 0, 0.15), rgba(255, 59, 48, 0.15));
  color: #ff3b30; border: 0.5px solid rgba(255, 59, 48, 0.35); border-radius: 999px;
  padding: 4px 10px; font-size: 12px; font-weight: 700; margin-top: 6px;
}

/* 마커 핀 */
.pin {
  transform: translate(-50%, -100%); padding: 6px 12px; border-radius: 999px;
  white-space: nowrap; cursor: pointer; display: inline-flex; align-items: center;
  gap: 5px; font-size: 13px; font-weight: 600; box-shadow: 0 4px 16px rgba(0, 0, 0, 0.15);
  border: 0.5px solid rgba(0, 0, 0, 0.12);
}
.pin.tier-gold { background: linear-gradient(135deg, #fff2cc, #ffd666); color: #5c3b00; }
.pin.tier-silver { background: linear-gradient(135deg, #f5f5f7, #dcdce2); color: #2c2c2e; }
.pin.tier-bronze { background: linear-gradient(135deg, #faebd7, #e2b18a); color: #4a2810; }
.pin.tier-titanium { background: #ececf0; color: #38383a; }
.pin.tier-neutral { background: #f2f2f7; color: #636366; }
.pin.tier-muted { background: #e5e5ea; color: #8e8e93; }
/* v0.058: 지도는 항상 밝은 색이라 핀은 다크 모드에서도 흰색으로 고정 */
.pin.tier-none { background: #ffffff; color: #1d1d1f; }
.pin.biz { background: rgba(255,255,255,.96); color: #60646a; font-size: 12px; border: 1px solid rgba(60,60,67,.16); }
/* v0.057: 넓은 축척용 원 표시 (색은 평점 등급, 빨강은 인증된 진짜 간짜장) */
.pin-dot { width:14px; height:14px; border-radius:50%; transform:translate(-50%,-50%); cursor:pointer; border:2px solid #fff; box-shadow:0 1px 4px rgba(0,0,0,.35); background:#c7c7cc; }
.pin-dot.is-group { width:18px; height:18px; }
.pin-dot.tier-gold { background:#ffc53d; }
.pin-dot.tier-silver { background:#aeaeb6; }
.pin-dot.tier-bronze { background:#d39462; }
.pin-dot.tier-titanium, .pin-dot.tier-neutral, .pin-dot.tier-muted { background:#9a9aa1; }
.pin-dot.tier-none { background:#ffffff; border-color:#8e8e93; }
.pin-dot.is-real { background:linear-gradient(135deg, var(--apple-real-start), var(--apple-real-end)); border-color:#fff; }

#ver-badge {
  position: absolute; z-index: 6; left: 14px; bottom: calc(env(safe-area-inset-bottom, 0px) + 14px);
  font-size: 11px; font-weight: 600; color: var(--label-secondary); background: var(--glass-bg);
  padding: 4px 9px; border-radius: 10px; pointer-events: none; border: 0.5px solid var(--glass-border);
}

#sheet {
  position: absolute; z-index: 8; left: 0; right: 0; bottom: 0; max-height: 86%; overflow-y: auto;
  touch-action: pan-y; -webkit-overflow-scrolling: touch; overscroll-behavior: contain;
  background: var(--card-bg); border-radius: 28px 28px 0 0;
  padding: 24px 22px calc(env(safe-area-inset-bottom, 0px) + 24px);
  box-shadow: var(--sheet-shadow); transform: translateY(105%);
  transition: transform 0.32s cubic-bezier(0.16, 1, 0.3, 1);
}
#sheet.open { transform: translateY(0); }
#sheet::before { content: ""; display: block; width: 38px; height: 5px; background: var(--separator); border-radius: 999px; margin: -8px auto 16px; }

.x {
  position: absolute; right: 16px; top: 18px; width: 32px; height: 32px; border-radius: 50%;
  background: var(--secondary-card-bg); color: var(--label-secondary); font-size: 14px;
  font-weight: 700; display: flex; align-items: center; justify-content: center;
}

h2 { font-size: 24px; font-weight: 700; letter-spacing: -0.025em; padding-right: 36px; line-height: 1.25; }
h3 { font-size: 15px; font-weight: 600; margin: 20px 0 8px; color: var(--label-secondary); }
.sub { color: var(--label-secondary); font-size: 14px; margin-top: 5px; line-height: 1.4; }

.stats { display: flex; gap: 10px; margin: 18px 0; }
.stats div { flex: 1; background: var(--secondary-card-bg); border-radius: 18px; padding: 14px 16px; border: 0.5px solid var(--separator); }
.stats small { display: block; color: var(--label-secondary); font-size: 12px; margin-bottom: 2px; }
.stats b { font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }

.btns { display: flex; flex-direction: column; gap: 9px; margin-top: 14px; }
.btn {
  display: flex; align-items: center; justify-content: center; text-decoration: none;
  background: var(--secondary-card-bg); border-radius: 16px; padding: 15px;
  font-size: 16px; font-weight: 600; width: 100%; border: 0.5px solid var(--separator);
}
.btn.primary { background: var(--apple-blue); color: #fff; border: none; box-shadow: 0 4px 14px rgba(0, 113, 227, 0.28); }

input {
  width: 100%; height: 50px; border: 0.5px solid var(--separator); border-radius: 16px;
  padding: 0 16px; font-size: 16px; background: var(--secondary-card-bg); color: var(--label-primary);
  margin-top: 8px;
}

/* 가격 입력 전용 카드 */
.price-input-card {
  background: var(--secondary-card-bg); border-radius: 18px; padding: 14px 16px;
  border: 0.5px solid var(--separator); margin: 14px 0 6px;
}
.price-input-card label { display: block; font-size: 13px; font-weight: 600; color: var(--label-secondary); margin-bottom: 6px; }
.price-field-wrap { display: flex; align-items: center; gap: 8px; }
.price-field-wrap input { margin-top: 0; flex: 1; font-weight: 700; font-size: 18px; }
.price-field-wrap span { font-size: 16px; font-weight: 600; color: var(--label-secondary); }

/* 평가 항목 박스 */
.rating-box {
  display: flex; flex-direction: column; gap: 10px;
  background: var(--secondary-card-bg); padding: 14px; border-radius: 20px;
  margin-top: 12px; border: 0.5px solid var(--separator);
}
.rating-row-real {
  display: flex; flex-direction: column; gap: 8px;
  background: var(--card-bg); padding: 12px 14px; border-radius: 14px;
  box-shadow: var(--card-shadow);
}
.rating-row-real label { font-size: 14px; font-weight: 700; color: var(--label-primary); }
.segment-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.seg-btn {
  height: 42px; border-radius: 12px; font-size: 14px; font-weight: 600;
  background: var(--secondary-card-bg); border: 0.5px solid var(--separator);
  color: var(--label-secondary); transition: all 0.15s ease;
}
.seg-btn.active.yes {
  background: #ff9500; color: #fff; border-color: #ff9500; box-shadow: 0 2px 8px rgba(255, 149, 0, 0.3);
}
.seg-btn.active.no {
  background: #8e8e93; color: #fff; border-color: #8e8e93;
}

.rating-row {
  display: flex; align-items: center; justify-content: space-between;
  background: var(--card-bg); padding: 11px 14px; border-radius: 14px;
  box-shadow: var(--card-shadow);
}
.rating-row label { font-size: 14px; font-weight: 600; color: var(--label-primary); white-space: nowrap; }
.star-row { display: flex; align-items: center; gap: 6px; }
.star-btn {
  font-size: 22px; color: var(--separator); width: 30px; height: 30px;
  display: inline-flex; align-items: center; justify-content: center;
  transition: transform 0.1s ease;
}
.star-btn:active { transform: scale(1.25); }
.star-btn.on { color: var(--apple-gold); }

.rating-row-total {
  display: flex; align-items: center; justify-content: space-between;
  background: rgba(255, 149, 0, 0.08); border: 0.5px solid rgba(255, 149, 0, 0.3);
  padding: 12px 14px; border-radius: 14px;
}
.rating-row-total label { font-size: 14px; font-weight: 700; color: var(--label-primary); }
.total-score { font-size: 18px; font-weight: 800; color: var(--apple-gold); }

.photo-uploader { margin-top: 12px; display: flex; flex-direction: column; gap: 8px; }
.photo-upload-btn {
  display: flex; align-items: center; justify-content: center; gap: 8px; height: 48px;
  background: var(--secondary-card-bg); border: 1px dashed var(--separator); border-radius: 14px;
  color: var(--apple-blue); font-size: 14px; font-weight: 600;
}
.photo-preview-box {
  position: relative; width: 100%; height: 180px; border-radius: 14px; overflow: hidden;
  border: 0.5px solid var(--separator);
}
.photo-preview-box img { width: 100%; height: 100%; object-fit: cover; }
.photo-remove-btn {
  position: absolute; top: 8px; right: 8px; width: 28px; height: 28px; border-radius: 50%;
  background: rgba(0, 0, 0, 0.65); color: #fff; display: flex; align-items: center; justify-content: center;
}

.rv { padding: 12px 0; border-top: 0.5px solid var(--separator); font-size: 15px; }
.u { color: var(--apple-blue); font-weight: 600; }
.rv-photo-wrap { margin-top: 8px; border-radius: 12px; overflow: hidden; max-height: 220px; }
.rv-photo { width: 100%; max-height: 220px; object-fit: cover; }

#toast {
  position: fixed; z-index: 9999; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 116px);
  transform: translateX(-50%);
  background: var(--glass-bg); color: var(--label-primary);
  -webkit-backdrop-filter: saturate(190%) blur(28px); backdrop-filter: saturate(190%) blur(28px);
  padding: 14px 26px; border-radius: 999px;
  font-size: 15px; font-weight: 650; letter-spacing: -0.02em; line-height: 1.35;
  white-space: nowrap; word-break: keep-all; text-align: center; pointer-events: none;
  border: 0.5px solid var(--glass-border);
  box-shadow: 0 14px 36px rgba(0, 0, 0, 0.16), 0 4px 12px rgba(0, 0, 0, 0.08);
  max-width: min(92vw, 540px);
}
#toast[hidden] { display: none; }

@media (min-width: 768px) {
  #top-container {
    left: 20px;
    right: auto;
    width: 420px;
  }
  #res {
    left: 20px;
    right: auto;
    width: 420px;
  }
  #sheet {
    left: 20px;
    right: auto;
    bottom: 20px;
    width: 420px;
    max-height: calc(100vh - 40px);
    border-radius: 28px;
    border: 0.5px solid var(--glass-border);
    box-shadow: 0 16px 48px rgba(0, 0, 0, 0.25);
  }
  #ver-badge {
    left: auto;
    right: 14px;
    bottom: 14px;
  }
}

/* MYGJJ navigation drawer */
.nav-toggle{width:46px;height:46px;flex-shrink:0;border-radius:14px;display:grid;place-items:center;font-size:23px;line-height:1}
#nav-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.38);z-index:19;opacity:0;visibility:hidden;transition:opacity .23s,visibility .23s}
#nav-drawer{position:fixed;top:0;bottom:0;left:0;width:min(320px,86vw);z-index:20;background:var(--card-bg);box-shadow:8px 0 36px rgba(0,0,0,.18);transform:translateX(-105%);transition:transform .25s ease;overflow-y:auto;padding:calc(env(safe-area-inset-top,0px) + 22px) 18px calc(env(safe-area-inset-bottom,0px) + 22px)}
body.nav-open #nav-backdrop{opacity:1;visibility:visible}
body.nav-open #nav-drawer{transform:translateX(0)}
.nav-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}
.nav-head strong{font-size:21px;letter-spacing:-.04em}
.nav-close{width:36px;height:36px;border-radius:50%;background:var(--secondary-card-bg);font-size:20px}
.nav-section-title{font-size:11px;color:var(--label-tertiary);font-weight:700;letter-spacing:.04em;margin:20px 10px 7px}
.nav-link{display:flex;align-items:center;gap:13px;width:100%;min-height:47px;text-align:left;border-radius:12px;padding:10px 12px;font-size:15px;font-weight:600}
.nav-link:active,.nav-link:hover{background:var(--secondary-card-bg)}
.nav-icon{width:22px;text-align:center;font-size:17px}
.nav-sep{height:1px;background:var(--separator);margin:13px 0}

function getDistanceMeters(lat1, lng1, lat2, lng2) {
  const R = 6371e3;
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLng = (lng2 - lng1) * Math.PI / 180;
  const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
            Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
            Math.sin(dLng / 2) * Math.sin(dLng / 2);
  return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a)));
}

const SHEET_STAGES = [0.52, 1]; // half, full

function sheetMaxHeight(){
  return Math.max(160, (window.visualViewport?.height || window.innerHeight) - (window.innerWidth >= 768 ? 40 : 0));
}
function sheetHeightAt(stage){
  const vh = sheetMaxHeight();
  return stage === 1 ? vh : Math.round(vh * 0.52);
}
function setSheetStage(stage){
  sheetStage = Math.max(0, Math.min(1, stage));
  const el = $('sheet');
  el.style.maxHeight = sheetMaxHeight() + 'px';
  el.style.height = sheetHeightAt(sheetStage) + 'px';
  el.classList.toggle('sheet-expanded', sheetStage === 1);
  const handle = $('sheet-drag-handle');
  if (handle) {
    handle.setAttribute('aria-valuenow', String(sheetStage ? 100 : 52));
    handle.setAttribute('aria-valuetext', sheetStage ? '전체 화면' : '절반 화면');
  }
}
function setupSheetDragHandle(){
  const handle = $('sheet-drag-handle');
  if (!handle) return;
  handle.addEventListener('pointerdown', e => {
    if (e.button !== 0 || !$('sheet').classList.contains('open')) return;
    sheetDrag = {id:e.pointerId, y:e.clientY, height:$('sheet').getBoundingClientRect().height, moved:false};
    handle.setPointerCapture(e.pointerId);
    $('sheet').classList.add('sheet-dragging');
    e.preventDefault();
  });
  handle.addEventListener('pointermove', e => {
    if (!sheetDrag || e.pointerId !== sheetDrag.id) return;
    const dy = sheetDrag.y - e.clientY;
    if (Math.abs(dy)>4) sheetDrag.moved = true;
    const h = Math.max(60, Math.min(sheetMaxHeight(), sheetDrag.height+dy));
    $('sheet').style.height = Math.round(h)+'px';
    e.preventDefault();
  });
  const finishDrag = e => {
    if (!sheetDrag || e.pointerId !== sheetDrag.id) return;
    const dy = e.clientY - sheetDrag.y; // positive when dragging down
    const startedHeight = sheetDrag.height;
    const moved = sheetDrag.moved;
    sheetDrag = null;
    $('sheet').classList.remove('sheet-dragging');
    if (handle.hasPointerCapture(e.pointerId)) handle.releasePointerCapture(e.pointerId);
    if (!moved) { setSheetStage(sheetStage); return; }
    
    const half = sheetHeightAt(0), full = sheetHeightAt(1);
    const currentHeight = $('sheet').getBoundingClientRect().height;

    // Direct dismissal conditions:
    // 1. Pulled down past 40% of half height
    if (currentHeight < half * 0.72) { closeSheet(); return; }
    // 2. Dragged down significantly from half height
    if (startedHeight <= half + 40 && dy > 55) { closeSheet(); return; }
    // 3. Dragged down significantly from full height
    if (startedHeight > half + 40 && (dy > 160 || currentHeight < full * 0.55)) { closeSheet(); return; }

    // Snapping transitions:
    if (dy > 60) { setSheetStage(0); return; }
    if (dy < -60) { setSheetStage(1); return; }

    // Nearest snap
    setSheetStage(Math.abs(currentHeight - half) < Math.abs(currentHeight - full) ? 0 : 1);
  };
  handle.addEventListener('pointerup', finishDrag);
  handle.addEventListener('pointercancel', finishDrag);
  handle.addEventListener('dblclick', () => setSheetStage(sheetStage ? 0 : 1));
  handle.addEventListener('keydown', e => {
    if (e.key==='ArrowUp' || e.key==='End') { e.preventDefault();setSheetStage(1); }
    if (e.key==='ArrowDown') { e.preventDefault(); if(sheetStage===0) closeSheet(); else setSheetStage(0); }
    if (e.key==='Home') { e.preventDefault();setSheetStage(0); }
    if (e.key==='Escape') { e.preventDefault();closeSheet(); }
  });
}

async function resizeImageFile(file, maxDimension = 1200, quality = 0.82) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        let w = img.width, h = img.height;
        if (w > maxDimension || h > maxDimension) {
          if (w > h) { h = Math.round((h * maxDimension) / w); w = maxDimension; }
          else { w = Math.round((w * maxDimension) / h); h = maxDimension; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        canvas.toBlob(blob => blob ? resolve(blob) : reject(new Error('압축 실패')), 'image/jpeg', quality);
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function getRatingTier(avg){
  if (!avg || isNaN(avg)) return 'tier-none';
  const val = parseFloat(avg);
  if (val >= 4.5) return 'tier-gold';
  if (val >= 4.0) return 'tier-silver';
  if (val >= 3.5) return 'tier-bronze';
  if (val >= 3.0) return 'tier-titanium';
  if (val >= 2.0) return 'tier-neutral';
  return 'tier-muted';
}

async function fetchAll(table, cols, orderCol){
  const size = 1000; let from = 0, all = [];
  while (true){
    const { data, error } = await db.from(table).select(cols).order(orderCol).range(from, from + size - 1);
    if (error) throw new Error(table + ': ' + error.message);
    all = all.concat(data || []);
    if (!data || data.length < size) break;
    from += size;
  }
  return all;
}

function placePriority(p) {
  const rt = rate[p.id];
  const avg = Number(rt?.avg_rating) || 0;
  const count = Math.max(0, Number(rt?.n) || 0);
  if (!count || !avg) return 150;
  const tier = avg >= 4.5 ? 500 : avg >= 4 ? 400 : avg >= 3.5 ? 300 : 200;
  return tier + Math.min(70, Math.round(Math.log2(count + 1) * 12));
}
function mapPixelPosition(lat, lng) {

  } catch (e) { return null; }
}

function isVerifiedReal(p) {

const PIN_LABEL_ZOOM = 13; // 네이버 지도 축척 막대 약 1km
function drawPins(){
  if (!map || typeof naver === 'undefined' || !naver.maps) return;
  markers.forEach(m => m.setMap(null));
  markers = [];
  if (!filterJjajangOnly) return; // 꺼짐: 등록 매장도 fetchNearbyBiz에서 일반 핀으로 그림

  let listToDraw = places.filter(p => {
    if (filterRealOnly && !isVerifiedReal(p)) return false;
    const rt = rate[p.id];
    const avg = rt ? parseFloat(rt.avg_rating) : 0;
    const price = Number(p.price || 0);

    if (filterRating !== 'all') {
      if (!avg || isNaN(avg) || avg <= 0) return false;
      const target = parseInt(filterRating, 10);
      if (target === 5) {
        if (avg < 5.0) return false;
      } else if (target === 4) {
        if (avg < 4.0 || avg >= 5.0) return false; // 4.00 ~ 4.99...
      } else if (target === 3) {
        if (avg < 3.0 || avg >= 4.0) return false; // 3.00 ~ 3.99...
      } else if (target === 2) {
        if (avg < 2.0 || avg >= 3.0) return false; // 2.00 ~ 2.99...
      } else if (target === 1) {
        if (avg < 1.0 || avg >= 2.0) return false; // 1.00 ~ 1.99...
      }
    }
    
    // 가격대 필터 로직
    if (filterPrice !== 'all') {
      if (price <= 0) return false;
      if (filterPrice === '6000s' && (price < 6000 || price >= 7000)) return false; // 6000원대 (가성비 구간 포함)
      if (filterPrice === '7000s' && (price < 7000 || price >= 8000)) return false;
      if (filterPrice === '8000s' && (price < 8000 || price >= 9000)) return false;
      if (filterPrice === '9000s' && (price < 9000 || price >= 10000)) return false; // 9000원대 ~ 10000원
      if (filterPrice === 'over_10000' && price < 10000) return false; // 10000원 이상
    }

    return true;
  });

  const groups = {};
  listToDraw.forEach(p => {
    if (!Number.isFinite(Number(p.lat)) || !Number.isFinite(Number(p.lng))) return;
    const key = `${parseFloat(p.lat).toFixed(5)},${parseFloat(p.lng).toFixed(5)}`;
    if (!groups[key]) groups[key] = [];
    groups[key].push(p);
  });

  const showLabels = map.getZoom() >= PIN_LABEL_ZOOM;
  Object.values(groups).forEach(list => {
    list.sort((a,b) => placePriority(b) - placePriority(a));
    const first = list[0];
    const rt = rate[first.id];
    const avg = rt && Number.isFinite(Number(rt.avg_rating)) ? Number(rt.avg_rating).toFixed(1) : null;
    const tierClass = getRatingTier(avg);

    const st = realStats[first.id];
    const isAuthentic = SHOW_REAL && st && st.total >= 3 && ((st.yes / st.total) >= 0.9);
    const badgeHtml = isAuthentic ? `<span class="real-badge">🔥 찐</span> ` : '';

    /* v0.057: 넓게 볼 때(축척 1km보다 넓음)는 이름 없이 원으로만 표시 */
    if (!showLabels) {
      const dot = `<div class="pin-dot ${tierClass}${isAuthentic ? ' is-real' : ''}${list.length > 1 ? ' is-group' : ''}" title="${esc(first.name)}"></div>`;
      const mk = new naver.maps.Marker({
        map, position: new naver.maps.LatLng(first.lat, first.lng),
        zIndex: placePriority(first),
        icon: { content: dot, anchor: new naver.maps.Point(0, 0) }
      });
      naver.maps.Event.addListener(mk, 'click', () => list.length > 1 ? openPlaceGroup(list) : openPlace(first));
      markers.push(mk);
      return;
    }

    if (list.length === 1) {
      const p = first;
      const rateBadge = avg ? `<span style="font-weight:700;font-size:12px;margin-left:2px;">(★${avg}/${rt?.n || 0})</span>` : `<span style="font-weight:700;font-size:12px;margin-left:2px;">(★0.0/0)</span>`;
      const content = `<div class="pin ${tierClass}">${badgeHtml}<span style="font-weight:700">${esc(p.name)}</span> ${rateBadge}</div>`;

      const mk = new naver.maps.Marker({
        map, position: new naver.maps.LatLng(p.lat, p.lng),
        zIndex: placePriority(p),
        icon: { content, anchor: new naver.maps.Point(0, 0) }
      });
      naver.maps.Event.addListener(mk, 'click', () => openPlace(p));
      markers.push(mk);
    } else {
      const label = `${badgeHtml}${esc(first.name)} 외 ${list.length - 1}곳`;
      const mk = new naver.maps.Marker({
        map, position: new naver.maps.LatLng(first.lat, first.lng),
        zIndex: placePriority(first),
        icon: { content: `<div class="pin ${tierClass}">${label}</div>`, anchor: new naver.maps.Point(0, 0) }
      });
      naver.maps.Event.addListener(mk, 'click', () => openPlaceGroup(list));
      markers.push(mk);
    }
  });
}

  const preferredLeft = type === 'price' ? rect.right - popupWidth : rect.left;
  popEl.style.left = Math.max(margin, Math.min(preferredLeft, window.innerWidth - popupWidth - margin)) + 'px';
  popEl.style.top = Math.min(rect.bottom + 8, window.innerHeight - 20) + 'px';
}

// 리뷰 작성자 통계는 전체 리뷰(모든 식당)에서 계산합니다.
const reviewerStatsCache = new Map();
async function getReviewerStats(uid){
  if (!uid) return {count:0,avg:0,reviews:[]};
  if (reviewerStatsCache.has(uid)) return reviewerStatsCache.get(uid);
  const promise = (async()=>{
    let offset=0, all=[];
    const pageSize=500;
    while(true){
      const {data,error}=await db.from('reviews')
        .select('id,place_id,created_at,rating,comment,photo_url,is_real')
        .eq('user_id',uid).order('created_at',{ascending:false})
        .range(offset,offset+pageSize-1);
      if(error) throw error;
      all.push(...(data||[]));
      if(!data || data.length<pageSize) break;
      offset+=pageSize;
    }
    const rated=all.filter(r=>Number.isFinite(Number(r.rating)) && r.rating!==null);
    const avg=rated.length ? rated.reduce((sum,r)=>sum+Number(r.rating),0)/rated.length : 0;
    return {count:all.length,avg,reviews:all};
  })();
  reviewerStatsCache.set(uid,promise);
  try{return await promise;}catch(e){reviewerStatsCache.delete(uid);throw e;}
}
async function updateVisibleReviewerStats(reviews){
  const unique=[...new Set(reviews.map(r=>r.user_id).filter(Boolean))];
  await Promise.all(unique.map(async uid=>{
    try{
      const stat=await getReviewerStats(uid);
      document.querySelectorAll('#sheet .reviewer-stats').forEach(el=>{
        if(el.dataset.userStats===String(uid)) el.textContent=`(★ ${stat.count?stat.avg.toFixed(1):'-'} / ${stat.count})`;
      });
    }catch(e){
      console.warn('작성자 통계 오류:',e);
      document.querySelectorAll('#sheet .reviewer-stats').forEach(el=>{
        if(el.dataset.userStats===String(uid)) el.textContent='(정보 없음)';
      });
    }
  }));
}

function toggleNav(open){
  document.body.classList.toggle('nav-open',!!open);
  $('nav-toggle').setAttribute('aria-expanded',String(!!open));
  $('nav-drawer').setAttribute('aria-hidden',String(!open));

}

let userLocationMarker = null;
let locating = false;
function showUserLocation(coords) {
  myCoord = { lat:coords.latitude, lng:coords.longitude };
  if (!map || typeof naver === 'undefined' || !naver.maps) return;
  const point = new naver.maps.LatLng(myCoord.lat, myCoord.lng);
  if (!userLocationMarker) {
    userLocationMarker = new naver.maps.Marker({
      map, position:point, zIndex:1100,
      icon:{content:'<div style="width:19px;height:19px;background:#007aff;border:3px solid #fff;border-radius:50%;box-shadow:0 0 0 5px rgba(0,122,255,.16),0 2px 8px rgba(0,0,0,.25)" aria-label="내 위치"></div>',anchor:new naver.maps.Point(9,9)}
    });
  } else userLocationMarker.setPosition(point);
  map.panTo(point);
}
function locateMe(manual = true) {
  if (locating) return;
  if (!navigator.geolocation) {
    if(manual) toast('이 브라우저에서는 위치 확인을 지원하지 않습니다');
    return;
  }
  if (!window.isSecureContext) {
    if(manual) toast('현재 위치는 HTTPS 환경에서 사용할 수 있습니다');
    return;
  }
  locating = true;
  const btn = $('locate-btn');
  btn.disabled = true;
  btn.setAttribute('aria-busy','true');
  if (manual) toast('현재 위치를 확인하고 있습니다');
  navigator.geolocation.getCurrentPosition(pos => {
    locating = false;
    btn.disabled = false;
    btn.setAttribute('aria-busy','false');
    showUserLocation(pos.coords);
    if (manual) toast('현재 위치로 이동했습니다');
  }, err => {
    locating = false;
    btn.disabled = false;
    btn.setAttribute('aria-busy','false');
    if (!manual) { console.warn('초기 위치 조회:',err.message); return; }
    const messages = {
      1:'위치 접근이 차단되었습니다. 브라우저 사이트 설정에서 위치 권한을 허용해 주세요',
      2:'현재 위치를 확인할 수 없습니다. GPS 또는 위치 서비스를 확인해 주세요',
      3:'위치 확인 시간이 초과되었습니다. 다시 시도해 주세요'
    };
    toast(messages[err.code] || '위치를 확인하지 못했습니다');
  },{enableHighAccuracy:manual,timeout:manual?12000:7000,maximumAge:manual?0:60000});
}

async function fetchNearbyBiz(){
  if (!map) return;
  const mySeq = ++nearbySeq;
  try {
    const zoom = map.getZoom();
    // 축척이 넓을 때는 이미 평가된 매장만 보여줍니다.
    if (filterRealOnly || zoom < 15) { clearNearbyMarkers(); return; }
    const plainMode = !filterJjajangOnly;
    const bounds = map.getBounds();
    if (!bounds) return;
    const sw = bounds.getSW(), ne = bounds.getNE();
    if (!sw || !ne) return;

    const { data, error } = await db.from('biz_master')
      .select('*')
      .gte('lat', sw.lat()).lte('lat', ne.lat())
      .gte('lng', sw.lng()).lte('lng', ne.lng())
      .limit(250);

    if (mySeq !== nearbySeq) return;
    if (error) { console.warn('주변 매장 조회 실패', error); return; }
    const registeredBizIds = new Set(places.map(p => String(p.biz_id)).filter(x => x !== 'null' && x !== 'undefined'));
    let available = (data || []).filter(b => (plainMode || !registeredBizIds.has(String(b.id))) &&
      Number.isFinite(Number(b.lat)) && Number.isFinite(Number(b.lng)));
    if (plainMode) {
      // 꺼짐: 등록 매장도 일반 중국집처럼. 누르면 가게 정보가 열리도록 연결
      const placeByBiz = new Map(places.filter(p => p.biz_id).map(p => [String(p.biz_id), p]));
      available = available.map(b => placeByBiz.has(String(b.id)) ? { ...b, _place: placeByBiz.get(String(b.id)) } : b);
      places.filter(p => !p.biz_id && Number(p.lat) >= sw.lat() && Number(p.lat) <= ne.lat() && Number(p.lng) >= sw.lng() && Number(p.lng) <= ne.lng())
        .forEach(p => available.push({ id: 'place:' + p.id, name: p.name, lat: p.lat, lng: p.lng, road_addr: p.address, _place: p }));
    }

    // 지도에서 등록 식당과 겹치는 미등록 마커는 숨김: 우수매장 가독성 최우선.
    const priorityLocations = plainMode ? [] : places
      .filter(p => Number.isFinite(Number(p.lat)) && Number.isFinite(Number(p.lng)))
      .map(p => mapPixelPosition(p.lat, p.lng)).filter(Boolean);
    const clusterSize = zoom >= 18 ? 90 : zoom >= 17 ? 108 : (zoom >= 16 ? 128 : 148);
    const clusters = new Map();
    available.forEach(b => {
      const xy = mapPixelPosition(b.lat, b.lng);
      if (!xy) return;
      if (priorityLocations.some(p => Math.abs(p.x-xy.x)<85 && Math.abs(p.y-xy.y)<40)) return;
      const k = `${Math.floor(xy.x/clusterSize)}:${Math.floor(xy.y/clusterSize)}`;
      if (!clusters.has(k)) clusters.set(k, []);
      clusters.get(k).push({b,xy});
    });
    const limit = zoom >= 18 ? 20 : zoom >= 17 ? 18 : (zoom >= 16 ? 15 : 12);
    const size = map.getSize();
    const center = {x: size.width/2, y:size.height/2};
    const selected = [...clusters.values()]
      .sort((a,b) => {
        const da = Math.hypot(a[0].xy.x-center.x,a[0].xy.y-center.y);
        const db = Math.hypot(b[0].xy.x-center.x,b[0].xy.y-center.y);
        return da-db;
      }).slice(0,limit);
    clearNearbyMarkers();
    selected.forEach(list => {
      const first = list[0].b;
      const isGroup = list.length > 1;
      list.forEach(({b}) => { biz[b.id] = b; });
      const content = isGroup
        ? `<div class="pin biz biz-group">+ 중국집 ${list.length}곳</div>`
        : `<div class="pin biz biz-single">+ <span class="pin-label">${esc(first.name)}</span></div>`;
      const mk = new naver.maps.Marker({
        map, position:new naver.maps.LatLng(first.lat,first.lng),
        zIndex:40,
        icon:{content,anchor:new naver.maps.Point(0,0)}
      });
      naver.maps.Event.addListener(mk,'click',() => {
        if (isGroup) openNearbyGroup(list.map(x=>x.b));
        else if (first._place) openPlace(first._place);
        else openNew(first);
      });
      nearbyMarkers.push(mk);
    });
  } catch (err) { console.warn('주변 매장 표시 오류:',err); }
}
function openNearbyGroup(list){
  sheet('<h2>'+(filterJjajangOnly?'이 주변 미등록 식당':'이 주변 식당')+'</h2><p class="sub">'+list.length+'개 식당을 확인할 수 있어요.</p>'+
    '<div style="margin-top:14px">'+list.map(b=>
      `<button class="row" data-a="openNearbyBiz" data-id="${esc(b.id)}"><b>${esc(b.name)}</b><small>${esc(b.road_addr||b.lot_addr||'주소 정보 없음')}</small><i>보기</i></button>`
    ).join('')+'</div>');
}
$('q').oninput = e => { clearTimeout(st); st = setTimeout(() => search(e.target.value.trim()), 250); };
let st;
async function search(q){
  const box = $('res'); if (!q){ ++searchSeq; box.hidden = true; return; }
  const mySeq = ++searchSeq;
  const local = places.filter(p => p.name.includes(q)).slice(0, 10);
  const { data, error } = await db.from('biz_master').select('*').ilike('name', '%' + q.replace(/[%_]/g, '') + '%').limit(20);
  if (error) { console.warn('검색 실패', error); if(mySeq === searchSeq) toast('검색에 실패했습니다'); return; }
  if (mySeq !== searchSeq) return;
  const reg = new Set(places.map(p => String(p.biz_id)));
  const rows = (data || []).filter(b => !reg.has(String(b.id)));
  biz = Object.fromEntries(rows.map(b => [b.id, b]));

  let h = local.map(p => '<button class="row" data-a="place" data-id="' + esc(p.id) + '"><b>' + esc(p.name) + '</b><small>' + esc(p.address) + '</small><i>' + won(p.price) + '원</i></button>').join('');
  h += rows.map(b => '<button class="row" data-a="pick" data-id="' + esc(b.id) + '"><b>' + esc(b.name) + '</b><small>' + esc(b.road_addr || b.lot_addr) + ' · 등록 가능</small></button>').join('');
  box.innerHTML = h || '<div class="empty">검색 결과가 없습니다.</div>'; box.hidden = false;
}

load();

s.src = 'https://oapi.map.naver.com/openapi/v3/maps.js?ncpKeyId=' + encodeURIComponent(CLIENT_ID) + '&ncpClientId=' + encodeURIComponent(CLIENT_ID);
s.onload = initMap;
document.head.appendChild(s);
</script>
